-- ============================================================================
--  vedetta · Conky configuration
--  Transparent, draggable, auto-scaling desktop widget (right side).
--
--  All content is produced by bin/collect.sh.
--  Geometry + font size live in ../state.lua (written by bin/vedetta).
--  If conky ever fails to start, run:  bash bin/collect.sh   (data is fine)
-- ============================================================================

local home = os.getenv("HOME") or "/root"
local base = home .. "/.config/conky/vedetta"

local function load_lua(path, fallback)
  local fh = io.open(path, "r")
  if not fh then return fallback end
  fh:close()
  local ok, tbl = pcall(dofile, path)
  if ok and type(tbl) == "table" then return tbl end
  return fallback
end

local st = load_lua(base .. "/state.lua", {})

local scale = tonumber(st.scale) or 10
local gapx  = tonumber(st.gapx)  or 26
local gapy  = tonumber(st.gapy)  or 56
local align = st.align           or "top_right"
local tint  = tonumber(st.tint)  or 26   -- 0..255 window alpha (~10 %)

-- 54 columns of DejaVu Sans Mono advance ≈ 0.803 em/char at 96 dpi
local width = math.floor(54 * scale * 0.8031) + 22

conky.config = {
  -- placement ---------------------------------------------------------------
  alignment       = align,
  gap_x           = gapx,
  gap_y           = gapy,
  minimum_width   = width,
  maximum_width   = width,

  -- window / transparency ---------------------------------------------------
  own_window            = true,
  own_window_type       = "normal",
  own_window_title      = "vedetta",
  own_window_transparent = false,       -- MUST be false for the tint to show
  own_window_argb_visual = true,
  own_window_argb_value  = tint,        -- baked-in dark tint behind text
  own_window_colour      = "0E1620",
  own_window_hints       = "undecorated,below,sticky,skip_taskbar,skip_pager",
  background     = false,
  border_width   = 0,
  draw_borders   = false,
  draw_shades    = false,
  draw_outline   = false,
  draw_graph_borders = false,

  -- text --------------------------------------------------------------------
  use_xft          = true,
  xftalpha         = 1.0,
  font             = "DejaVu Sans Mono:size=" .. scale,
  override_utf8_locale = true,
  uppercase        = false,
  text_buffer_size = 40960,           -- collector emits ~2 KB; default 256 truncates

  -- timing ------------------------------------------------------------------
  update_interval = 2,
  total_run_times = 0,
  disable_auto_reload = false,
  double_buffer       = true,     -- flicker-free redraw (pattern: kambei/conky-orange)
  cpu_avg_samples     = 2,        -- smoothed CPU% (pattern: kambei/conky-orange)
  net_avg_samples     = 2,        -- smoothed net rates (pattern: kambei/conky-orange)
  no_buffers          = true,     -- RAM accounting without cache (pattern: kambei/conky-orange)
  xinerama_head       = 0,

  default_color = "#C8D6E0",
  default_bar_width  = 10,
  default_bar_height = 6,
}

conky.text = [[${execpi 2 bash ]] .. base .. [[/bin/collect.sh}]]
